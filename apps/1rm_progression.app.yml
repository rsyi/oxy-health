  - name: all_exercises_combined
    type: execute_sql
    sql_query: |
      WITH per_month AS (
          SELECT
              Exercise,
              DATE_TRUNC('month', Date) AS month,
              weight,
              reps,
              weight * (POWER(reps, 0.1)) AS est_1RM
          FROM personal_data.exercise.strength_tracker
          WHERE Exercise IN ('Barbell Deadlift', 'Flat Barbell Bench Press', 'Barbell Squat', 'Overhead Press')
      ),
      max_per_month AS (
          SELECT
              Exercise,
              month,
              MAX(est_1RM) AS max_estimated_1RM
          FROM per_month
          GROUP BY Exercise, month
      )
      SELECT
          m.Exercise,
          strftime(m.month, '%Y-%m') as month,
          m.max_estimated_1RM
      FROM max_per_month m
      ORDER BY m.month, m.Exercise
    database: motherduck

display:
  - type: markdown
    content: |
      # 1RM Progression Tracker

      Track your estimated 1 Rep Max (1RM) progression over time using the Lombardi formula:
      **1RM = Weight × (Reps^0.1)**

      This dashboard shows your strength progression across major compound lifts.

  - type: line_chart
    title: All Exercises - 1RM Progression Over Time
    data: all_exercises_combined
    x: month
    y: max_estimated_1RM
    series: Exercise
    x_axis_label: Month
    y_axis_label: Estimated 1RM (lbs)

  - type: line_chart
    title: Deadlift - 1RM Progression
    data: deadlift_1rm
    x: month
    y: max_estimated_1RM
