    data: overhead_press_1rm
    x: month
    y: max_estimated_1RM
    x_axis_label: Month
    y_axis_label: Estimated 1RM (lbs)

  - type: table
    title: Deadlift - Detailed Monthly Data
    data: deadlift_1rm

