tasks:
  - name: deadlift_1rm
    type: execute_sql
    sql_query: |
      WITH per_month AS (
          SELECT
              DATE_TRUNC('month', Date) AS month,
              weight,
              reps,
              weight * (POWER(reps, 0.1)) AS est_1RM
          FROM personal_data.exercise.strength_tracker
          WHERE Exercise = 'Barbell Deadlift'
      ),
      max_per_month AS (
          SELECT
              month,
              MAX(est_1RM) AS max_estimated_1RM
          FROM per_month
          GROUP BY month
      )
      SELECT
          strftime(m.month, '%Y-%m') as month,
          m.max_estimated_1RM,
          p.weight AS corresponding_weight,
          p.reps AS corresponding_reps
      FROM max_per_month m
      JOIN per_month p
        ON p.month = m.month
       AND p.est_1RM = m.max_estimated_1RM
      ORDER BY m.month
    database: motherduck

