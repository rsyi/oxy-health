name: workout_plan
description: "Generate a workout plan for the upcoming week based on recent performance"

tasks:
  - name: generate_workout_plan
    type: agent
    agent_ref: health_analyst.agent.yml
    prompt: |
      Come up with a workout plan for this upcoming week based on my last two months of performance.

      CRITICAL: Before creating the workout plan, first query my body composition data to determine if I'm currently:
      - Bulking (weight/calories increasing)
      - Cutting (weight/calories decreasing)
      - Maintaining (stable weight)

      Use these measures from the body_composition topic:
      - avg_weight by week (last 8-12 weeks)
      - weight_change by month (last 2-3 months)
      - avg_weekly_weight_change
      - estimated_daily_caloric_balance
      - estimated_weekly_caloric_balance

      Then adjust your workout recommendations based on my current phase:
      - If bulking: emphasize progressive overload, higher volume strength work, focus on building
      - If cutting: focus on maintaining strength, moderate volume to preserve muscle, avoid excessive fatigue
      - If maintaining: balanced approach to strength and conditioning

      Make sure to explicitly state whether I'm bulking, cutting, or maintaining in your response.
