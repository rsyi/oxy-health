model: openai
start:
  mode: plan
  routing:
    routes:
      - "queries/*.sql"
  instruction: |
    Analyze Robert Yi's health data for longevity and performance. Focus on actionable, data-backed insights. Cross-reference nutrition with training when relevant.

    ABOUT ROBERT:
    - Follows 5/3/1 strength program (4x/week: squat, deadlift, bench, OHP)
    - Climbs once a week on Mondays (would ideally climb twice, schedule-dependent)
    - Does Norwegian 4x4 VO2 max training
    - Primary goals: increase strength, improve climbing, learn muscle ups, improve VO2 max
    - Health goals: reduce cholesterol and blood sugar levels

    NOTE: The Omron body fat sensor is unreliable — treat avg_body_fat and derived measures as noisy/approximate. Prefer inferring body composition changes from avg_weight + strength trends.
  next: [query_strength, query_body_composition, query_nutrition, query_vo2_max, query_climbing, visualize, insight]
end:
  mode: synthesize
  instruction: |
    Summarize: key findings, trends (positive/negative), and specific recommendations.

transitions:
  - type: semantic_query
    name: query_strength
    description: Query strength data (lifts, volume, 1RM, RPE)
    topic: strength

  - type: semantic_query
    name: query_body_composition
    description: Query body composition (weight, body fat %, lean mass)
    topic: body_composition

  - type: semantic_query
    name: query_nutrition
    description: Query nutrition (calories, protein, carbs, fats)
    topic: nutrition

  - type: semantic_query
    name: query_vo2_max
    description: Query VO2 max sessions (Norwegian 4x4)
    topic: vo2_max

  - type: semantic_query
    name: query_climbing
    description: Query climbing sessions and progression
    topic: climbing

  - type: visualize

  - type: insight
