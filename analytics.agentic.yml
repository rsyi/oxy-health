databases:
  - type: duckdb
    path: ./.db

llm:
  model: claude-sonnet-4-6
  max_tokens: 8000

states:
  clarifying:
    instructions: |
      Ask at most one clarifying question. Prefer to make a reasonable assumption
      and state it clearly rather than asking for confirmation.
    thinking: effort::low
    max_retries: 10
  specifying:
    max_retries: 10
    thinking: effort::low
  solving:
    thinking: effort::low
    max_retries: 10

