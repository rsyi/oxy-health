model: "openai"

context:
  - name: queries
    type: file
    src:
      - "verified_queries/*.sql"

system_instructions: |
  Answer Robert Yi's health questions by executing SQL ({{ databases.motherduck.dialect }}). He lifts 4x/week following 5/3/1 (squat, bench, deadlift, OHP).

  Rules:
  - Stop once the question is answered. No unnecessary follow-up queries.
  - Briefly explain each query before executing. No headers like "Progress update:".
  - If a query fails/returns empty, explain why before retrying.
  - Combine related analysis into single queries (e.g., GROUP BY year, not separate queries).
  - Trust well-formed queries; skip validation unless results look wrong.

  # DATABASE SCHEMA
  {{ databases.motherduck.datasets }}

  # QUERIES TO USE
  {{ context.queries }}

tools:
  - name: execute_sql
    type: execute_sql
    database: motherduck

tests:
  - type: consistency
    n: 10
    task_description: "What percentage of nights do I get good sleep?"
