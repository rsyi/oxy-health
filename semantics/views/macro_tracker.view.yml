name: macro_tracker
description: "Nutrition log from MacroFactor tracking individual food entries with macronutrients and meal-level detail"
datasource: motherduck
table: nutrition.macro_tracker_macrofactor_full_log

entities:
  - name: nutrition_entry
    type: primary
    description: "Individual food entry in the nutrition log"
    key: food_entry_id

  - name: nutrition_day
    type: foreign
    description: "Day of nutrition tracking for daily aggregation"
    key: date

dimensions:
  - name: food_entry_id
    type: string
    description: "Unique identifier for each food entry"
    expr: "\"Date\" || ' ' || \"Time\" || ' ' || \"Food Name\""

  - name: date
    type: date
    description: "Date of nutrition entry"
    expr: "Date"

  - name: time
    type: string
    description: "Time of day the food was logged"
    expr: "Time"
    synonyms: ["meal time", "time of day", "when"]

  - name: food_name
    type: string
    description: "Name of the food item logged"
    expr: "\"Food Name\""
    synonyms: ["food", "item", "what I ate", "meal item"]

  - name: year
    type: number
    description: "Year of nutrition entry"
    expr: "EXTRACT(YEAR FROM Date)"

  - name: month
    type: date
    description: "Month start date for aggregation"
    expr: "DATE_TRUNC('month', Date)"
    synonyms: ["year-month", "month"]

  - name: week
    type: date
    description: "Week start date (Monday) for aggregation"
    expr: "DATE_TRUNC('week', Date)"
    synonyms: ["week start", "week"]

  - name: day_of_week
    type: string
    description: "Day of week name"
    expr: "DAYNAME(Date)"
    synonyms: ["weekday"]

  - name: protein_ratio
    type: number
    description: "Percentage of calories from protein"
    expr: "(\"Protein (g)\" * 4.0) / NULLIF(\"Calories (kcal)\", 0) * 100"
    synonyms: ["protein percentage", "protein %"]

  - name: carb_ratio
    type: number
    description: "Percentage of calories from carbohydrates"
    expr: "(\"Carbs (g)\" * 4.0) / NULLIF(\"Calories (kcal)\", 0) * 100"
    synonyms: ["carb percentage", "carb %"]

  - name: fat_ratio
    type: number
    description: "Percentage of calories from fat"
    expr: "(\"Fat (g)\" * 9.0) / NULLIF(\"Calories (kcal)\", 0) * 100"
    synonyms: ["fat percentage", "fat %"]

measures:
  - name: total_entries
    type: count
    description: "Total number of food entries logged"
    synonyms: ["entry count", "number of entries"]

  - name: total_days
    type: count_distinct
    description: "Total number of distinct days tracked"
    expr: "Date"
    synonyms: ["days tracked", "number of days"]

  - name: unique_foods
    type: count_distinct
    description: "Number of distinct food items consumed"
    expr: "\"Food Name\""
    synonyms: ["different foods", "food variety"]

  - name: total_calories
    type: sum
    description: "Total calories consumed in kcal"
    expr: "\"Calories (kcal)\""
    synonyms: ["calories", "calorie intake", "kcal"]

  - name: total_protein
    type: sum
    description: "Total protein consumed in grams"
    expr: "\"Protein (g)\""
    synonyms: ["protein", "protein intake"]

  - name: total_carbs
    type: sum
    description: "Total carbohydrates consumed in grams"
    expr: "\"Carbs (g)\""
    synonyms: ["carbs", "carbohydrates", "carb intake"]

  - name: total_fat
    type: sum
    description: "Total fat consumed in grams"
    expr: "\"Fat (g)\""
    synonyms: ["fat", "fat intake", "dietary fat"]

  - name: total_fiber
    type: sum
    description: "Total dietary fiber consumed in grams"
    expr: "\"Fiber (g)\""
    synonyms: ["fiber", "fibre", "dietary fiber"]

  - name: avg_entry_calories
    type: average
    description: "Average calories per food entry"
    expr: "\"Calories (kcal)\""
    synonyms: ["avg calories per item"]

  - name: avg_daily_calories
    type: custom
    description: "Average daily caloric intake in kcal"
    expr: "SUM(\"Calories (kcal)\") / NULLIF(COUNT(DISTINCT Date), 0)"
    synonyms: ["daily calories", "calories per day", "avg calories"]

  - name: avg_daily_protein
    type: custom
    description: "Average daily protein intake in grams"
    expr: "SUM(\"Protein (g)\") / NULLIF(COUNT(DISTINCT Date), 0)"
    synonyms: ["daily protein", "protein per day", "avg protein"]

  - name: avg_daily_carbs
    type: custom
    description: "Average daily carbohydrate intake in grams"
    expr: "SUM(\"Carbs (g)\") / NULLIF(COUNT(DISTINCT Date), 0)"
    synonyms: ["daily carbs", "carbs per day", "avg carbs"]

  - name: avg_daily_fat
    type: custom
    description: "Average daily fat intake in grams"
    expr: "SUM(\"Fat (g)\") / NULLIF(COUNT(DISTINCT Date), 0)"
    synonyms: ["daily fat", "fat per day", "avg fat"]
