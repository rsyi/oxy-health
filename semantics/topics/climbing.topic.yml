name: climbing
description: |
  Rock climbing tracking for mobility, movement quality, and body awareness - essential for maintaining functional movement patterns and joint health as part of longevity training.

  To determine which days climbing happens, group climbing_days by the day_of_week dimension.
base_view: kaya
views:
  - kaya

