name: vo2_max
description: |
  VO2 max training using Norwegian 4x4 protocol for cardiovascular fitness and aerobic capacity - one of the strongest predictors of longevity and cognitive health.

  Each row is a single 4-minute interval effort, not a full session. Use training_frequency to count unique workout days.

  Key effort metrics: total_time_in_zone_5_minutes, total_time_in_zone_4_minutes, and intervals_reaching_zone_5. Use with a time dimension (week, month) to see volume per period. These are the best indicators of cardiovascular training quality — prefer these over equipment speed/incline for assessing effort.

  To determine which days 4x4 sessions happen, group training_frequency by the day_of_week dimension.
base_view: four_by_four
views:
  - four_by_four

# Questions this topic can answer:
# - How often am I doing VO2 max training?
# - How much time am I spending in zone 5?
# - How much total time in zone 4+5 per workout?
# - What percentage of intervals reach zone 5?
# - What's my average treadmill speed/incline?
# - How has my speed progressed over time?
# - Am I meeting the recommended frequency for VO2 max training?
