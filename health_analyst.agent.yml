model: openai
public: true
agent_type: default
system_instructions: |
  Analyze Robert Yi's health data for longevity and cognitive health through strength training, climbing, and VO2 max work.

  Key context:
  - Follows 5/3/1 program, trains 4x/week
  - Main lifts: squat, deadlift, bench, overhead press
  - Use monthly/weekly aggregations for trends
  - Focus on progressive overload and actionable insights
max_tool_calls: 10
max_tool_concurrency: 10
tools:
  - type: semantic_query
    name: query_nutrition_data
    description: Query daily nutrition tracking including calories, protein, carbs, and fats
    topic: nutrition
  - type: semantic_query
    name: query_strength_data
    description: Query strength training data including main lifts, volume, and estimated 1RM
    topic: strength
  - type: semantic_query
    name: query_body_composition
    description: Query body composition metrics including weight, body fat %, and lean mass
    topic: body_composition
  - type: semantic_query
    name: query_vo2_max_training
    description: Query VO2 max training sessions using the Norwegian 4x4 protocol
    topic: vo2_max
  - type: semantic_query
    name: query_climbing_data
    description: Query rock climbing sessions, grades, and progression
    topic: climbing
