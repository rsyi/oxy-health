cubes:
  - name: body_composition
    sql_table: body.body_composition_tracker
    data_source: motherduck
    title: body_composition
    description: Body composition tracking including weight and body fat percentage measurements using Omron scale for monitoring lean mass and body composition trends
    dimensions:
    - name: measurement_id
      sql: CAST("Datetime (Local)" AS VARCHAR)
      type: string
      title: measurement_id
      description: Unique identifier for each measurement
      primary_key: true
    - name: datetime
      sql: '"Datetime (Local)"'
      type: time
      title: datetime
      description: Timestamp of measurement
    - name: date
      sql: CAST("Datetime (Local)" AS DATE)
      type: time
      title: date
      description: Date of measurement
    - name: year
      sql: EXTRACT(YEAR FROM "Datetime (Local)")
      type: number
      title: year
      description: Year of measurement
    - name: month
      sql: DATE_TRUNC('month', CAST("Datetime (Local)" AS DATE))
      type: time
      title: month
      description: Month start date for aggregation
    - name: week
      sql: DATE_TRUNC('week', CAST("Datetime (Local)" AS DATE))
      type: time
      title: week
      description: Week start date (Monday) for aggregation
    - name: day_of_week
      sql: DAYNAME(CAST("Datetime (Local)" AS DATE))
      type: string
      title: day_of_week
      description: Day of week name
    - name: training_phase
      sql: |
        CASE
          WHEN (
            ("Weight (lbs)" - AVG("Weight (lbs)") OVER (
              ORDER BY "Datetime (Local)"
              RANGE BETWEEN INTERVAL 7 DAYS PRECEDING AND INTERVAL 1 DAY PRECEDING
            )) / 7 * 7
          ) > 0.25 THEN 'Bulk'
          WHEN (
            ("Weight (lbs)" - AVG("Weight (lbs)") OVER (
              ORDER BY "Datetime (Local)"
              RANGE BETWEEN INTERVAL 7 DAYS PRECEDING AND INTERVAL 1 DAY PRECEDING
            )) / 7 * 7
          ) < -0.25 THEN 'Cut'
          ELSE 'Maintenance'
        END
      type: string
      title: training_phase
      description: Current training phase based on weight trend vs previous 7-day average. Bulk = gaining >0.25 lbs/week, Cut = losing >0.25 lbs/week, Maintenance = stable
    measures:
    - name: total_measurements
      sql: '1'
      type: count
      title: total_measurements
      description: Total number of body composition measurements
    - name: avg_weight
      sql: '"Weight (lbs)"'
      type: avg
      title: avg_weight
      description: Average body weight in pounds
    - name: avg_body_fat
      sql: '"Body Fat % (Omron)"'
      type: avg
      title: avg_body_fat
      description: Average body fat percentage (only non-null measurements)
    - name: avg_lean_mass
      sql: '"Weight (lbs)" * (1 - "Body Fat % (Omron)" / 100.0)'
      type: avg
      title: avg_lean_mass
      description: Average lean body mass (only for dates with body fat measurements)
      filters:
      - sql: '"Body Fat % (Omron)" IS NOT NULL'
    - name: avg_fat_mass
      sql: '"Weight (lbs)" * ("Body Fat % (Omron)" / 100.0)'
      type: avg
      title: avg_fat_mass
      description: Average fat mass (only for dates with body fat measurements)
      filters:
      - sql: '"Body Fat % (Omron)" IS NOT NULL'
    - name: min_weight
      sql: '"Weight (lbs)"'
      type: min
      title: min_weight
      description: Minimum weight in period
    - name: max_weight
      sql: '"Weight (lbs)"'
      type: max
      title: max_weight
      description: Maximum weight in period
    - name: min_body_fat
      sql: '"Body Fat % (Omron)"'
      type: min
      title: min_body_fat
      description: Minimum body fat % in period
    - name: max_body_fat
      sql: '"Body Fat % (Omron)"'
      type: max
      title: max_body_fat
      description: Maximum body fat % in period
    - name: weight_variance
      sql: STDDEV_SAMP("Weight (lbs)")
      type: number
      title: weight_variance
      description: Standard deviation of weight measurements
    - name: body_fat_variance
      sql: STDDEV_SAMP("Body Fat % (Omron)")
      type: number
      title: body_fat_variance
      description: Standard deviation of body fat measurements (only non-null)
    - name: weight_change
      sql: LAST("Weight (lbs)" ORDER BY "Datetime (Local)") - FIRST("Weight (lbs)" ORDER BY "Datetime (Local)")
      type: number
      title: weight_change
      description: Directional weight change (last minus first). Positive = gaining, negative = losing. Requires an aggregated time dimension (week, month, etc.) to be meaningful
    - name: weight_trend_slope
      sql: REGR_SLOPE("Weight (lbs)", EXTRACT(EPOCH FROM "Datetime (Local)") / 86400)
      type: number
      title: weight_trend_slope
      description: Daily rate of weight change (lbs/day). Positive = gaining, negative = losing, near zero = maintaining. Requires an aggregated time dimension (week, month, etc.) to be meaningful
    - name: avg_weekly_weight_change
      sql: |
        (LAST("Weight (lbs)" ORDER BY "Datetime (Local)") - FIRST("Weight (lbs)" ORDER BY "Datetime (Local)")) /
        NULLIF(EXTRACT(DAY FROM (MAX("Datetime (Local)") - MIN("Datetime (Local)"))), 0) * 7
      type: number
      title: avg_weekly_weight_change
      description: Average weekly weight change rate. Positive = gaining, negative = losing. Requires an aggregated time dimension (week, month, etc.) to be meaningful
    - name: estimated_daily_caloric_balance
      sql: |
        ((LAST("Weight (lbs)" ORDER BY "Datetime (Local)") - FIRST("Weight (lbs)" ORDER BY "Datetime (Local)")) * 3500) /
        NULLIF(EXTRACT(DAY FROM (MAX("Datetime (Local)") - MIN("Datetime (Local)"))), 0)
      type: number
      title: estimated_daily_caloric_balance
      description: Estimated daily caloric surplus/deficit based on weight change (3500 cal = 1 lb). Requires an aggregated time dimension (week, month, etc.) to be meaningful
    - name: estimated_weekly_caloric_balance
      sql: |
        ((LAST("Weight (lbs)" ORDER BY "Datetime (Local)") - FIRST("Weight (lbs)" ORDER BY "Datetime (Local)")) * 3500) /
        NULLIF(EXTRACT(DAY FROM (MAX("Datetime (Local)") - MIN("Datetime (Local)"))), 0) * 7
      type: number
      title: estimated_weekly_caloric_balance
      description: Estimated weekly caloric surplus/deficit based on weight change (3500 cal = 1 lb). Requires an aggregated time dimension (week, month, etc.) to be meaningful
